<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Molly's Kill Count</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Barrio&display=swap"
  rel="stylesheet"
/>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: "Century Gothic", "Futura", "Trebuchet MS", Arial, sans-serif;
    transition: background 0.6s ease;
  }

  :root {
    --bg: #0b0f1a;
    --fg: #e9eefc;
  }

  .card {
    width: min(760px, 94vw);
    padding: 28px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
  }

  h1 {
    margin: 0 0 18px 0;
    font-size: clamp(36px, 8vw, 52px);
    font-family: "Barrio", cursive;
  }

  .line {
    font-size: clamp(20px, 5vw, 24px);
  }

  #killCount {
    display: inline-block;
    padding: 6px 16px;
    margin: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    font-weight: 800;
    font-size: clamp(26px, 6vw, 34px);
  }

  button {
    margin-top: 16px;
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    color: inherit;
    cursor: pointer;
  }

  button:active {
    transform: scale(0.97);
  }

  .history-controls {
    margin-top: 14px;
  }

  .history {
    display: none;
    margin-top: 14px;
    max-height: 320px;
    overflow-y: auto;
    text-align: left;
    font-size: 14px;
    opacity: 0.9;
  }

  .history div {
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .label {
    opacity: 0.7;
    font-size: 12px;
    margin-left: 6px;
  }

  .version {
    margin-top: 18px;
    font-size: 12px;
    opacity: 0.5;
  }
</style>

  </head>

  <body>
    <div class="card">
      <h1>Molly's Kill Count</h1>

  <p class="line">
    Molly has killed
    <span id="killCount">0</span>
    people
  </p>

  <button id="toggleHistoryBtn" onclick="toggleHistory()">
    Show History
  </button>

  <div class="history-controls" id="historyControls" style="display: none;">
    <button onclick="toggleSort()">
      Sort: <span id="sortLabel">Newest</span>
    </button>
  </div>

  <div id="history" class="history"></div>

  <button id="audioToggleBtn" onclick="toggleAudio()">
    Play Music
  </button>
</div>

<div class="version">Update 1.2</div>

<audio id="bgAudio" src="Kill.mp3" loop preload="auto"></audio>

<script>
  const START_VALUE = 755550;
  const DAILY_INCREASE = 575;

  const START_UTC_MS = Date.UTC(2026, 0, 14, 5, 0, 0);
  const MS_PER_DAY = 86400000;

  const SPECIAL_DAY_UTC = Date.UTC(2026, 1, 6, 5, 0, 0);
  const SPECIAL_REDUCTION = 49;

  const HISTORY_START_UTC = Date.UTC(2023, 0, 1, 5, 0, 0);

  const colorStages = [
    "#0b0f1a",
    "#1a0b16",
    "#0b1a14",
    "#1a160b",
    "#120b1a",
    "#0b121a"
  ];

  let historyOpen = false;
  let sortNewestFirst = true;

  function calculateKillCount(atTime = Date.now()) {
    let daysPassed = Math.floor(
      (atTime - START_UTC_MS) / MS_PER_DAY
    );

    let total = START_VALUE + (daysPassed * DAILY_INCREASE);

    if (atTime >= SPECIAL_DAY_UTC) {
      total -= SPECIAL_REDUCTION;
    }

    return total;
  }

  function applyColor(value) {
    const stage =
      Math.floor(Math.abs(value) / 100000) %
      colorStages.length;

    document.documentElement.style.setProperty(
      "--bg",
      colorStages[stage]
    );
  }

  function renderMain() {
    const value = calculateKillCount();

    document.getElementById("killCount").textContent =
      value.toLocaleString("en-US");

    applyColor(value);
  }

  function toggleHistory() {
    historyOpen = !historyOpen;

    const box = document.getElementById("history");
    const btn = document.getElementById("toggleHistoryBtn");
    const controls = document.getElementById("historyControls");

    if (historyOpen) {
      btn.textContent = "Hide History";
      controls.style.display = "block";
      box.style.display = "block";
      renderHistory();
    } else {
      btn.textContent = "Show History";
      controls.style.display = "none";
      box.style.display = "none";
    }
  }

  function toggleSort() {
    sortNewestFirst = !sortNewestFirst;

    document.getElementById("sortLabel").textContent =
      sortNewestFirst ? "Newest" : "Oldest";

    renderHistory();
  }

  function renderHistory() {
    const box = document.getElementById("history");
    box.innerHTML = "";

    const todayIndex = Math.floor(
      (Date.now() - HISTORY_START_UTC) / MS_PER_DAY
    );

    const todayHistoryTime =
      HISTORY_START_UTC +
      (todayIndex * MS_PER_DAY);

    let entries = [];
    let current = HISTORY_START_UTC;

    while (current <= Date.now()) {
      entries.push({
        time: current,
        value: calculateKillCount(current)
      });

      current += MS_PER_DAY;
    }

    if (sortNewestFirst) {
      entries.reverse();
    }

    entries.forEach(entry => {
      let dateText;

      if (entry.time === todayHistoryTime) {
        dateText = "Today";
      } else if (
        entry.time === todayHistoryTime - MS_PER_DAY
      ) {
        dateText = "Yesterday";
      } else {
        dateText = new Date(entry.time)
          .toISOString()
          .slice(0, 10);
      }

      box.innerHTML +=
        "<div>" +
        dateText +
        " — " +
        entry.value.toLocaleString() +
        "</div>";
    });
  }

  const audio = document.getElementById("bgAudio");
  const audioBtn =
    document.getElementById("audioToggleBtn");

  function toggleAudio() {
    if (audio.paused) {
      audio.play().catch(() => {});
      audioBtn.textContent = "Pause Music";
    } else {
      audio.pause();
      audioBtn.textContent = "Resume Music";
    }
  }

  renderMain();
  setInterval(renderMain, 60000);
</script>
  </body>
</html>
